<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Тренировки | Запись</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Экран авторизации -->
        <div id="auth-screen" class="screen active">
            <div class="container">
                <h1>Твой тренер</h1>
                <input type="text" id="phone-input" placeholder="Телефон" autocomplete="off">
                <input type="text" id="name-input" placeholder="Имя">
                <button id="login-btn" class="btn primary">Войти / Зарегистрироваться</button>
            </div>
        </div>

        <!-- Главное меню -->
        <div id="menu-screen" class="screen">
            <div class="container">
                <h2>Привет, <span id="user-name"></span></h2>
                <button id="book-btn" class="btn primary">📅 Записаться</button>
                <button id="my-bookings-btn" class="btn secondary">📋 Мои записи</button>
                <button id="admin-btn" class="btn admin" style="display: none;">⚙️ Админ-панель</button>
                <button id="logout-btn" class="btn logout">Выйти</button>
            </div>
        </div>

        <!-- Экран записи -->
        <div id="booking-screen" class="screen">
            <div class="container">
                <button class="btn back-btn">← Назад</button>
                <h2>Выбери время</h2>
                <div id="slots-list" class="slots-grid"></div>
                <button id="confirm-booking-btn" class="btn primary" style="display: none;">Подтвердить запись</button>
            </div>
        </div>

        <!-- Экран моих записей -->
        <div id="my-bookings-screen" class="screen">
            <div class="container">
                <button class="btn back-btn">← Назад</button>
                <h2>Мои тренировки</h2>
                <div id="my-bookings-list"></div>
            </div>
        </div>

        <!-- Админ панель -->
        <div id="admin-screen" class="screen">
            <div class="container">
                <button class="btn back-btn">← Назад</button>
                <h2>Управление слотами</h2>
                
                <div id="admin-slots"></div>
                
                <div class="admin-form">
                    <h3>Добавить новый слот (1 час)</h3>
                    <input type="datetime-local" id="admin-start">
                    <button id="admin-add-slot" class="btn primary">➕ Добавить слот</button>
                    <p style="font-size: 12px; color: #666; margin-top: 8px;">* Конец слота автоматически ставится +1 час</p>
                </div>
                
                <div id="admin-bookings"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
